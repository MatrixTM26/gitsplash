name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 */6 * * *'

  push:
    branches: [main]
    paths-ignore:
      - 'output/**'
      - '.cache/**'
      - 'README.md'

  watch:
    types: [started]

  fork:

  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub username (leave empty to use repo owner)'
        required: false
        default: ''
      clear_cache:
        description: 'Clear cache before running'
        required: false
        type: boolean
        default: false
      animated:
        description: 'Enable SVG animations'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Stats SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'        # ✅ Node 22 LTS (not deprecated)
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps   # ✅ fix peer dep conflict

      - name: Restore API Cache
        uses: actions/cache@v4
        with:
          path: .cache/
          key: github-api-cache-${{ github.repository_owner }}-${{ github.run_id }}
          restore-keys: |
            github-api-cache-${{ github.repository_owner }}-

      - name: Clear Cache
        if: github.event.inputs.clear_cache == 'true'
        run: rm -rf .cache/

      - name: Build TypeScript
        run: npm run build

      - name: Generate Stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.event.inputs.username || github.repository_owner }}
          OUTPUT_DIR: output
          CACHE_DIR: .cache
          CACHE_TTL: '120'
          ANIMATED: ${{ github.event.inputs.animated || 'true' }}
          DEBUG: ${{ runner.debug }}
        run: npm start

      - name: Commit Output
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          if git diff --staged --quiet; then
            echo "No SVG changes — skipping commit"
          else
            git commit -m "chore(stats): update SVGs [skip ci]

          Generated: $(date -u '+%Y-%m-%d %H:%M UTC')
          Trigger: ${{ github.event_name }}"
            git push
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-svgs-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Job Summary
        if: always()
        run: |
          echo "## 📊 GitHub Stats Generation" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\` | **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/meta.json ]; then
            echo "### Stats Snapshot" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat output/meta.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in output/*.svg; do
            [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -sh "$f" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
