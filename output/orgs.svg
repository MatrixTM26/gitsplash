<svg width="495" height="158" viewBox="0 0 495 158"
  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  role="img" aria-label="Organizations">
  <title>Organizations</title>
  <defs>
    <linearGradient id="grad-bg" x1="0.85" y1="0.15" x2="0.15" y2="0.85" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#111517"/><stop offset="50%" stop-color="#182127"/><stop offset="100%" stop-color="#161b22"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 0.5 0.5; 360 0.5 0.5"
        dur="12s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6cace0"/><stop offset="50%" stop-color="#5c74d6"/><stop offset="100%" stop-color="#864dcb"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 0.5 0.5; 360 0.5 0.5"
        dur="8s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="grad-chart" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6cace0" stop-opacity="0.9"/><stop offset="100%" stop-color="#5c74d6" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="grad-glow" cx="0.5" cy="0.5" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6cace0" stop-opacity="0.3"/><stop offset="100%" stop-color="#6cace0" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card-clip">
      <rect width="495" height="158" rx="12" ry="12"/>
    </clipPath></defs>
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter></defs>
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="495" height="158" rx="12" ry="12" fill="url(#grad-bg)" clip-path="url(#card-clip)"/>
    <g opacity="1"><line x1="40" y1="0" x2="40" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="80" y1="0" x2="80" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="120" y1="0" x2="120" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="160" y1="0" x2="160" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="200" y1="0" x2="200" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="240" y1="0" x2="240" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="280" y1="0" x2="280" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="320" y1="0" x2="320" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="360" y1="0" x2="360" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="400" y1="0" x2="400" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="440" y1="0" x2="440" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="480" y1="0" x2="480" y2="158" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="40" x2="495" y2="40" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="80" x2="495" y2="80" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="120" x2="495" y2="120" stroke="#2d3943" stroke-width="1" opacity="0.08"/></g>
    
    <rect x="0.5" y="0.5" width="494" height="157"
      rx="11.5" fill="none"
      stroke="url(#grad-accent)" stroke-width="1" opacity="0.5"/>
    
    <g id="title-section" opacity="0">
      <text x="20" y="36" font-size="18" dominant-baseline="middle">⊞</text><text x="42" y="36" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#e6edf3" text-anchor="start" dominant-baseline="middle" letter-spacing="0.5">Organizations</text><text x="42" y="50" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#7b8e9d" text-anchor="start" dominant-baseline="middle" opacity="0.8">Member of 1 organization</text>
      <line id="title-line" x1="16" y1="52" x2="479" y2="52"
        stroke="url(#grad-accent)" stroke-width="1" opacity="0.4"/>
      
    <animate attributeName="opacity" from="0" to="1"
      dur="0.5s" begin="0s" fill="freeze" calcMode="spline"
      keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </g>
    <g transform="translate(0, 56)">
      
    <g opacity="0">
      <rect x="16" y="0" width="463" height="66" rx="8" fill="#1d2225" stroke="#2d3943" stroke-width="0.5" opacity="0.85"/><circle cx="46" cy="33" r="18" fill="#6cace0" stroke="#2d3943" stroke-width="0.5"/><text x="46" y="33" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">EM</text><text x="68" y="18" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#e6edf3" text-anchor="start" dominant-baseline="middle">emperor-sec</text><text x="68" y="33" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#7b8e9d" text-anchor="start" dominant-baseline="middle">@emperor-sec</text><text x="68" y="48" font-size="9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#7b8e9d" text-anchor="start" dominant-baseline="middle" opacity="0.7">Security Resear…</text>
    <rect x="16" y="0" width="463" height="66" rx="8"
      fill="none" stroke="url(#grad-accent)" stroke-width="1" opacity="0"
      style="cursor:pointer"
      onmouseenter="this.setAttribute('opacity','0.6')"
      onmouseleave="this.setAttribute('opacity','0')"/>
      <animate attributeName="opacity" from="0" to="1"
        dur="0.5s" begin="0.1s" fill="freeze" calcMode="spline"
        keySplines="0.4 0 0.2 1" keyTimes="0;1"/><animateTransform attributeName="transform" type="translate"
        from="0 10" to="0 0"
        dur="0.5s" begin="0.1s" fill="freeze" calcMode="spline"
        keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </g>
    </g>
    
  </g>
</svg>