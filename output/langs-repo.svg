<svg width="495" height="195" viewBox="0 0 495 195"
  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  role="img" aria-label="Languages by Repository">
  <title>Languages by Repository</title>
  <defs>
    <linearGradient id="grad-bg" x1="0.85" y1="0.15" x2="0.15" y2="0.85" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#111517"/><stop offset="50%" stop-color="#182127"/><stop offset="100%" stop-color="#1d191b"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 0.5 0.5; 360 0.5 0.5"
        dur="12s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6cace0"/><stop offset="50%" stop-color="#d65c5c"/><stop offset="100%" stop-color="#7ecb4d"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        values="0 0.5 0.5; 360 0.5 0.5"
        dur="8s"
        repeatCount="indefinite"
      />
    </linearGradient>
    <linearGradient id="grad-chart" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6cace0" stop-opacity="0.9"/><stop offset="100%" stop-color="#d65c5c" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="grad-glow" cx="0.5" cy="0.5" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6cace0" stop-opacity="0.3"/><stop offset="100%" stop-color="#6cace0" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card-clip">
      <rect width="495" height="195" rx="12" ry="12"/>
    </clipPath></defs>
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter></defs>
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="495" height="195" rx="12" ry="12" fill="url(#grad-bg)" clip-path="url(#card-clip)"/>
    <g opacity="1"><line x1="40" y1="0" x2="40" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="80" y1="0" x2="80" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="120" y1="0" x2="120" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="160" y1="0" x2="160" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="200" y1="0" x2="200" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="240" y1="0" x2="240" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="280" y1="0" x2="280" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="320" y1="0" x2="320" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="360" y1="0" x2="360" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="400" y1="0" x2="400" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="440" y1="0" x2="440" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="480" y1="0" x2="480" y2="195" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="40" x2="495" y2="40" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="80" x2="495" y2="80" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="120" x2="495" y2="120" stroke="#2d3943" stroke-width="1" opacity="0.08"/><line x1="0" y1="160" x2="495" y2="160" stroke="#2d3943" stroke-width="1" opacity="0.08"/></g>
    
